name: Windows build and tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Debug build and tests
        shell: pwsh
        run: ./build.ps1 -Configuration Debug
      - name: Release build, tests and publish
        shell: pwsh
        run: ./publish.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: BVELauncher-win-x64
          path: artifacts/BVELauncher-win-x64.zip
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: TestResults/**/*.trx
